name: Trigger Private Repo Sync

on:
  pull_request:
    types: [closed]  # Only trigger after PRs are merged
  push:
    branches:
      - mirror       # Optional: trigger on direct pushes to mirror

jobs:
  notify-private:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger private repo sync
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PUBLIC_REPO_WEBHOOK_PAT }}" \
            https://api.github.com/repos/smarvin/gh-to-gh-roundtrip/dispatches \
            -d '{"event_type": "sync_public_to_private"}'

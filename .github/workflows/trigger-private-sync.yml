name: Trigger Private Repo Sync

on:
  pull_request:
    types: [closed]  # Trigger only after PRs are merged
  push:
    branches:
      - mirror  # Optional: trigger on direct pushes to mirror

jobs:
  notify-private:
    runs-on: ubuntu-latest

    steps:
      - name: Notify about triggering private repo
        run: echo "Triggering private repo sync..."

      - name: Trigger private repo sync
        id: trigger
        run: |
          MAX_RETRIES=3
          COUNT=0
          SUCCESS=0

          while [ $COUNT -lt $MAX_RETRIES ]; do
            COUNT=$((COUNT+1))
            echo "Attempt $COUNT to trigger private repo..."

            RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.public_repo_webhook_pat_

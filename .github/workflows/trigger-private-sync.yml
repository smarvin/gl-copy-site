name: Notify Private Repo for Sync

on:
  pull_request:
    types: [closed]  # Trigger after PRs are merged
  push:
    branches:
      - mirror       # Optional: trigger on direct pushes to mirror

jobs:
  notify-private:
    runs-on: ubuntu-latest

    steps:
      - name: Notify about triggering private repo
        run: echo "Triggering private repo sync..."

      - name: Trigger private repo sync
        id: trigger
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.public_repo_webhook_pat }}" \
            https://api.github.com/repos/smarvin/gh-to-gh-roundtrip/dispatches \
            -d '{"event_type": "sync_public_to_private"}')

          if [ "$RESPONSE" = "204" ]; then
            echo "✅ Private repo triggered successfully."
          else
            echo "❌ Failed to trigger private repo. HTTP status: $RESPONSE"
            echo "Response body:"
            cat response.json
            exit 1
          fi
